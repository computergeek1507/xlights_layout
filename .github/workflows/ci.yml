name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /xlights_layout/ --dart-define=GOOGLE_CLIENT_ID=ci-placeholder

      - name: Check pubspec.lock is up to date
        run: git diff --exit-code pubspec.lock || (echo "::error::pubspec.lock is out of date; run flutter pub get and commit it." && exit 1)

      - name: Upload resolved pubspec.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
